<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{margin:0;padding:0;}
#root{display:block;}
/* Host-side adaptive override for fold/tablet lanes:
   if model hard-codes small max-width (e.g. max-w-[420px]),
   expand first root container to lane width in larger modes. */
body[data-preview-mode="fold"] #root > :first-child,
body[data-preview-mode="tablet"] #root > :first-child{
  width: 100% !important;
  max-width: 100% !important;
}
</style>
<!-- <script src="https://cdn.jsdelivr.net/npm/genui-widgets@latest/dist/genui-widgets.umd.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div id="root"><div class="bg-neutral-900 text-white flex flex-col w-full h-full">
  <div class="shrink-0 p-3">
    <div class="font-bold text-lg">BIDU</div>
    <div class="text-sm text-neutral-400">Baidu, Inc.</div>
    <div class="inline-flex items-center gap-1 text-xs text-green-400">
      <span class="text-green-400">Closed</span>
    </div>
  </div>
  <div class="shrink-0 p-3">
    <div class="text-5xl font-light tabular-nums">$93.26</div>
    <div class="flex items-center gap-1 text-sm">
      <span class="text-red-400">↓</span><span class="text-red-400">0.17</span>
      <span class="text-red-400">(-0.18%)</span>
    </div>
  </div>
  <div class="flex-1 p-3">
    <div class="mb-3">
      <div class="text-sm text-neutral-500 mb-2">Price Trend</div>
      <div data-echarts='{
        "backgroundColor": "transparent",
        "xAxis": {
          "type": "category",
          "data": ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
        },
        "yAxis": {
          "type": "value",
          "name": "Price ($)"
        },
        "series": [
          {
            "name": "BIDU",
            "type": "line",
            "data": [112.82,107.24,109.81,108.22,107.52,107.39,105.34,105.29,104.92,105.27,107.48,111.11,113.06,112.58,111.11,109.33,109.71,109.5,105.94,104.84,104.68,103.67,104.12,90.87,92.87,91.97,93.21,92.18,93.43,93.26],
            "lineStyle": { "color": "#10b981" }
          },
          {
            "name": "Threshold",
            "type": "line",
            "data": [95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0,95.0],
            "lineStyle": { "color": "#10b981", "width": 2 }
          }
        ]
      }' class="w-full h-64"></div>
    </div>
    <div class="text-sm text-neutral-500 mb-2">Alert Condition</div>
    <div class="text-sm font-medium">Alert when BIDU price drops below $95.00</div>
    <div class="inline-flex items-center gap-1 text-sm text-red-400">
      <span>⚠️ Alert triggered</span>
    </div>
  </div>
  <div class="shrink-0 p-3">
    <button class="text-sm font-medium text-white hover:bg-white/20 rounded-md py-1 px-2 w-full text-right">View Full Quote Page</button>
  </div>
</div></div>
<script>
(() => {
  function parseInteractions(el) {
    if (!el) return null;
    const raw = el.getAttribute("data-interactions");
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;
    const node = target.closest("[data-interactions]");
    if (!node) return;
    const interactions = parseInteractions(node);
    const onClick = interactions && Array.isArray(interactions.onClick) ? interactions.onClick : [];
    if (!onClick.length) return;
    event.preventDefault();
    window.parent.postMessage({
      source: "h5-stream-ui-bridge",
      type: "interaction",
      event: "onClick",
      actions: onClick
    }, "*");
  }, true);
})();
</script>
<script>
(function(){function dM(t,s){var o={};for(var k in t){o[k]=t[k];}for(var k in s){if(typeof s[k]==='object'&&s[k]!==null&&!Array.isArray(s[k])){o[k]=dM(t[k]||{},s[k]);}else{o[k]=s[k];}}return o;}
function iC(){var els=document.querySelectorAll('[data-echarts]');if(!els.length)return;els.forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-echarts'));var opt=dM({color:['#0A59F7','#41BAF7','#7262FD','#FFB03B','#F76B1C'],backgroundColor:'#fff',grid:{top:'15%',bottom:'10%',left:'12%',right:'5%',containLabel:true},tooltip:{confine:true},legend:{bottom:0,itemWidth:12,itemHeight:12,textStyle:{fontSize:10}}},o);if(o.title){opt.title={text:o.title,textStyle:{fontSize:14},left:'center'};}var c=echarts.init(el);c.setOption(opt);window.addEventListener('resize',function(){c.resize();});}catch(e){el.innerHTML='<div style="color:#999;padding:20px;text-align:center;font-size:12px;">Chart error</div>';}});}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',iC);}else{iC();}})();
</script>
</body>
</html>
